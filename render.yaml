# Render Blueprint: in the Render dashboard choose New > Blueprint and pick this repo.
services:
  - type: web
    name: sudfa-plus
    runtime: docker
    plan: free
    healthCheckPath: /ping
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sudfa-plus-db
          property: connectionString

databases:
  - name: sudfa-plus-db
    plan: free
